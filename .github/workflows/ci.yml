# Lint, test the learner workspace, test every day's solution, and check lessons match solutions.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LAB_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # The tests download the time-skipping server and, without a `temporal` CLI, the dev server.
      - name: Cache the Temporal servers
        uses: actions/cache@v4
        with:
          path: |
            /tmp/temporal-sdk-python-*
            /tmp/temporal-test-server-sdk-python-*
          key: temporal-servers-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv run ruff check src tests solutions scripts lab
      - run: uv run pytest -q
      - run: uv run pytest -q lab/nautobot
      # Includes the replay tests (Day 6): a workflow change that would break a recorded history
      # fails here, before it can become a new build (Day 30).
      - run: scripts/test-solutions.sh
      - run: uv run python scripts/check_lessons.py
      - name: src/ starts identical to the Day 1 solution
        run: |
          diff -r -x __pycache__ src/netops_temporal solutions/day-01/netops_temporal
          diff -r -x __pycache__ -x test_check_lessons.py -x test_solution_runner.py tests solutions/day-01/tests
