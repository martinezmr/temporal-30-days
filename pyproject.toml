[project]
name = "temporal-30-days"
version = "0.1.0"
description = "30 days of Temporal (Python) for network automation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "temporalio[opentelemetry,openai-agents]>=1.34",
    "pydantic>=2.9",
    "pyeapi>=1.0.4",
    "netmiko>=4.8",
    "napalm>=5.2",
    "pynautobot>=3.2",
    "opentelemetry-sdk>=1.45.2",
    "aiohttp>=3.14.5",
    "openai>=1.60",
    "temporalio-openai-agents[mcp]>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netops_temporal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# A small, stable rule set: real bugs and import order, not style debates in teaching code.
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["netops_temporal"]
